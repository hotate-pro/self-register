name: Build minimal OpenCV.js (native runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: minimal-opencv-native
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-opencv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten 4.0.12
        run: |
          set -eux
          git clone --depth 1 --branch 4.0.12 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install 4.0.12
          ./emsdk/emsdk activate 4.0.12
          source ./emsdk/emsdk_env.sh
          emcc --version

      - name: Checkout OpenCV 4.13.0 source
        run: |
          set -eux
          git clone --depth 1 --branch 4.13.0 https://github.com/opencv/opencv.git opencv-src

      - name: Trim OpenCV.js runtime defaults
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("opencv-src/modules/js/CMakeLists.txt")
          s = p.read_text(encoding="utf-8")

          old = '-s TOTAL_MEMORY=128MB -s WASM_MEM_MAX=1GB -s ALLOW_MEMORY_GROWTH=1'
          new = '-s TOTAL_MEMORY=32MB -s WASM_MEM_MAX=256MB -s ALLOW_MEMORY_GROWTH=1'
          if old not in s:
              raise SystemExit("OpenCV JS memory settings were not found")
          s = s.replace(old, new, 1)

          old_fs = '-s FORCE_FILESYSTEM=1 --use-preload-plugins --bind'
          new_fs = '--bind'
          if old_fs not in s:
              raise SystemExit("OpenCV JS filesystem flags were not found")
          s = s.replace(old_fs, new_fs, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build only core + imgproc
        shell: bash
        run: |
          set -euxo pipefail
          source ./emsdk/emsdk_env.sh

          emcmake python3 opencv-src/platforms/js/build_js.py build \
            --build_wasm \
            --disable_single_file \
            --config=opencv-minimal-whitelist.json \
            --cmake_option=-DBUILD_opencv_calib3d=OFF \
            --cmake_option=-DBUILD_opencv_dnn=OFF \
            --cmake_option=-DBUILD_opencv_features2d=OFF \
            --cmake_option=-DBUILD_opencv_flann=OFF \
            --cmake_option=-DBUILD_opencv_gapi=OFF \
            --cmake_option=-DBUILD_opencv_ml=OFF \
            --cmake_option=-DBUILD_opencv_objdetect=OFF \
            --cmake_option=-DBUILD_opencv_photo=OFF \
            --cmake_option=-DBUILD_opencv_video=OFF \
            --cmake_option=-DBUILD_opencv_videoio=OFF \
            --cmake_option=-DBUILD_opencv_videostab=OFF \
            --cmake_option=-DBUILD_opencv_imgcodecs=OFF \
            --cmake_option=-DBUILD_opencv_shape=OFF \
            --cmake_option=-DBUILD_opencv_stitching=OFF \
            --cmake_option=-DBUILD_opencv_superres=OFF \
            --cmake_option=-DBUILD_TESTS=OFF \
            --cmake_option=-DBUILD_PERF_TESTS=OFF \
            --cmake_option=-DBUILD_EXAMPLES=OFF \
            --cmake_option=-DBUILD_DOCS=OFF \
            --cmake_option=-DBUILD_PACKAGE=OFF \
            --cmake_option=-DBUILD_ZLIB=OFF \
            --cmake_option=-DWITH_PTHREADS_PF=OFF \
            --build_flags="-O3 -flto -s ENVIRONMENT=web -s USE_PTHREADS=0 -s MALLOC=emmalloc -s ALLOW_MEMORY_GROWTH=1"

      - name: Extract external WASM
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build/bin")
          js_path = root / "opencv.js"

          if not js_path.is_file():
              raise SystemExit("build/bin/opencv.js was not produced")

          text = js_path.read_text(encoding="utf-8")
          m = re.search(r'var wasmBinaryFile="([^"]+)";', text)
          if not m:
              raise SystemExit("Could not find wasmBinaryFile in generated opencv.js")

          wasm_name = m.group(1)
          candidates = [root / wasm_name, root / Path(wasm_name).name]
          wasm_path = next((p for p in candidates if p.is_file()), None)

          if wasm_path is None:
              all_wasm = list(root.rglob("*.wasm"))
              if len(all_wasm) != 1:
                  raise SystemExit(f"Could not uniquely locate generated WASM: {all_wasm}")
              wasm_path = all_wasm[0]

          wasm = wasm_path.read_bytes()
          if wasm[:4] != b"\x00asm":
              raise SystemExit("Generated file is not a WebAssembly binary")

          js_path.write_text(
              text.replace(
                  f'var wasmBinaryFile="{wasm_name}";',
                  'var wasmBinaryFile="opencv.wasm";',
                  1,
              ),
              encoding="utf-8",
          )

          Path("opencv.wasm").write_bytes(wasm)

          print("opencv.js bytes:", js_path.stat().st_size)
          print("opencv.wasm bytes:", Path("opencv.wasm").stat().st_size)
          print("source wasm:", wasm_path)
          PY

          cp build/bin/opencv.js ./opencv.js
          grep -q 'var wasmBinaryFile="opencv.wasm";' opencv.js
          ! grep -q 'data:application/octet-stream;base64,' opencv.js
          test -s opencv.wasm
          ls -lh opencv.js opencv.wasm

      - name: Commit generated OpenCV
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencv.js opencv.wasm
          if git diff --cached --quiet; then
            echo "Generated OpenCV is already current."
            exit 0
          fi
          git commit -m "Use minimal OpenCV.js build [skip ci]"
          git push
