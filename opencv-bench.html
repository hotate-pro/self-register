<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCV Startup Benchmark</title>
<style>
body{font-family:system-ui,sans-serif;padding:24px;max-width:760px;margin:auto}
pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:12px}
button{font-size:20px;padding:12px 20px}
</style>
</head>
<body>
<h1>OpenCV起動ベンチ</h1>
<button id="run">OpenCVを起動</button>
<pre id="out">まだ実行していません。</pre>
<script>
const out=document.getElementById('out');
document.getElementById('run').onclick=async()=>{
  const t0=performance.now();
  const lines=[];
  const log=(s)=>{lines.push(s);out.textContent=lines.join('\n');};

  log('0 ms: 開始');

  const wasmUrl=new URL('./opencv.wasm',document.baseURI).href;

  const r0=performance.now();
  const response=await fetch(wasmUrl,{cache:'no-store'});
  const r1=performance.now();
  log(Math.round(r1-t0)+' ms: WASM HTTP '+response.status+' / fetch '+Math.round(r1-r0)+' ms');

  const b0=performance.now();
  const module=await WebAssembly.compile(await response.arrayBuffer());
  const b1=performance.now();
  log(Math.round(b1-t0)+' ms: WebAssembly.compile '+Math.round(b1-b0)+' ms');

  const s0=performance.now();
  window.Module={
    wasmBinary:module,
    locateFile:path=>new URL(path,new URL('./opencv.js',document.baseURI)).href,
    onRuntimeInitialized:()=>{
      const t=performance.now();
      log(Math.round(t-t0)+' ms: OpenCV runtime initialized');
    }
  };

  const script=document.createElement('script');
  script.src='./opencv.js';
  script.onerror=()=>log(Math.round(performance.now()-t0)+' ms: opencv.js ERROR');
  document.head.appendChild(script);

  const check=setInterval(()=>{
    if(window.cv && window.cv.Mat){
      clearInterval(check);
      const t=performance.now();
      log(Math.round(t-t0)+' ms: cv.Mat available / TOTAL '+Math.round(t-t0)+' ms');
    }
  },25);

  setTimeout(()=>clearInterval(check),60000);

  try {
    await new Promise((resolve,reject)=>{
      const started=performance.now();
      const timer=setInterval(()=>{
        if(window.cv && window.cv.Mat){
          clearInterval(timer); resolve();
        }
        if(performance.now()-started>60000){
          clearInterval(timer); reject(new Error('60秒タイムアウト'));
        }
      },25);
    });
  } catch(e) {
    log(Math.round(performance.now()-t0)+' ms: '+e.message);
  }
};
</script>
</body>
</html>
